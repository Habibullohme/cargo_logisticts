# Lokal ishga tushirish:  docker compose up --build
# Sayt (web/) va mobil ilova (mobile/) alohida, npm orqali ishga tushiriladi — README.md ga qarang.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: Asia/Tashkent
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # Faqat shu kompyuterdan ulanish mumkin (tashqi tarmoqdan emas).
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    ports:
      # Telefon (Expo Go) ham ulana olishi uchun barcha tarmoqlarda ochiq.
      - "8000:8000"
    volumes:
      - ./backend:/srv
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  bot:
    build: ./bot
    env_file: .env
    environment:
      API_URL: http://backend:8000
    depends_on:
      - backend
    volumes:
      - ./bot:/srv

volumes:
  pgdata:
